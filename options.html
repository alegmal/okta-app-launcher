<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Okta App Launcher — Settings</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body class="wide options">
    <main class="options-main">
      <h1>Okta App Launcher — Settings</h1>

      <section>
        <label for="domain">Your Okta domain</label>
        <input id="domain" type="text" placeholder="yourorg.okta.com" spellcheck="false" />
        <p class="hint">
          The host you see in the address bar on Okta (no https://, no path). Saving
          asks Chrome for permission to read your app list from this domain only.
        </p>
      </section>

      <div class="actions">
        <button id="save" class="save-btn">Save</button>
        <span id="status" class="save-status"></span>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
